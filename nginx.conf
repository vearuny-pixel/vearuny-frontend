server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mirror the headers already used by the Firebase Hosting deployment
  # (firebase.json hosting.headers) so both frontends behave identically.
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
